<a class="auction-card" [routerLink]="['/proizvod', lot.product.id]">
  <div class="card-image">
    <img [src]="coverImage" [alt]="lot.product.title" loading="lazy" />
    <span class="badge" [class.badge-used]="lot.product.state === 'used'">{{ stateLabel }}</span>
    <span class="category-chip">{{ lot.product.category }}</span>
  </div>

  <div class="card-body">
    <div class="lot-id">{{ lot.product.id }}</div>
    <div class="lot-name">{{ lot.product.title }}</div>

    <div class="lot-row">
      <div>
        <div class="lot-bid-label">Trenutna ponuda</div>
        <div class="lot-bid" [class.flash]="flash">{{ formattedBid }}</div>
      </div>
      <div class="lot-timer">
        <span class="lbl">Zatvara se za</span>
        {{ formattedTimer }}
      </div>
    </div>
  </div>
</a>

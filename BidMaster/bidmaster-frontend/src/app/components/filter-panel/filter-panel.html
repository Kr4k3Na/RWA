<div class="filter-panel">
  <div class="filter-search">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
      <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <input
      type="text"
      name="search"
      placeholder="Pretraži lotove po nazivu ili opisu..."
      [ngModel]="filters.search"
      (ngModelChange)="onSearchChange($event)"
    />
  </div>

  <div class="filter-row">
    <div class="filter-field">
      <label for="category">Kategorija</label>
      <select
        id="category"
        name="category"
        [ngModel]="filters.category"
        (ngModelChange)="onCategoryChange($event)"
      >
        <option [ngValue]="null">Sve kategorije</option>
        <option *ngFor="let cat of categories" [ngValue]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="state">Stanje</label>
      <select
        id="state"
        name="state"
        [ngModel]="filters.state"
        (ngModelChange)="onStateChange($event)"
      >
        <option value="all">Sve</option>
        <option value="new">Novo</option>
        <option value="used">Polovno</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="sortBy">Sortiraj po</label>
      <select
        id="sortBy"
        name="sortBy"
        [ngModel]="filters.sortBy"
        (ngModelChange)="onSortChange($event)"
      >
        <option value="closing-soon">Zatvara se uskoro</option>
        <option value="price-asc">Cena: rastuće</option>
        <option value="price-desc">Cena: opadajuće</option>
        <option value="most-bids">Najviše ponuda</option>
      </select>
    </div>

    <button type="button" class="btn btn-ghost reset-btn" (click)="resetFilters()">
      Resetuj
    </button>
  </div>
</div>

<div class="auth-card">
  <div class="auth-eyebrow">Dobrodošao nazad</div>
  <h1 class="auth-title">Prijavi se</h1>
  <p class="auth-sub">Nastavi tamo gde si stao — prati lotove i licitiraj u realnom vremenu.</p>

  <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)" novalidate>
    <div class="field">
      <label for="email">Email adresa</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        email
        [(ngModel)]="email"
        #emailModel="ngModel"
        [class.invalid]="emailModel.invalid && emailModel.touched"
        placeholder="ime@primer.com"
        autocomplete="email"
      />
      <p class="field-error" *ngIf="emailModel.invalid && emailModel.touched">
        Unesi ispravnu email adresu.
      </p>
    </div>

    <div class="field">
      <label for="password">Lozinka</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        minlength="6"
        [(ngModel)]="password"
        #passwordModel="ngModel"
        [class.invalid]="passwordModel.invalid && passwordModel.touched"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      <p class="field-error" *ngIf="passwordModel.invalid && passwordModel.touched">
        Lozinka mora imati najmanje 6 karaktera.
      </p>
    </div>

    <div class="field-row">
      <label class="checkbox">
        <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
        Zapamti me
      </label>
      <a href="#" class="link-muted">Zaboravljena lozinka?</a>
    </div>

    <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="btn btn-gold btn-lg btn-block" [disabled]="submitting">
      {{ submitting ? 'Prijavljivanje...' : 'Prijavi se' }}
    </button>
  </form>

  <p class="auth-switch">
    Nemaš nalog?
    <a routerLink="/registracija">Registruj se</a>
  </p>
</div>
